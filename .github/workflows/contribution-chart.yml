name: Generate Contribution Chart

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate chart SVG
        run: node .github/scripts/generate-chart.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: nodesagar

      - name: Push SVG to output branch
        run: |
          cp contribution-chart.svg /tmp/contribution-chart.svg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin output
          git checkout output
          cp /tmp/contribution-chart.svg contribution-chart.svg
          git add contribution-chart.svg
          git diff --cached --quiet || git commit -m "chore: update contribution chart"
          git push origin output
