name: Update Stats Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download stat cards
        run: |
          mkdir -p assets/stats
          curl -s "https://github-readme-stats.vercel.app/api?username=nodesagar&theme=nord&show_icons=true&hide_border=true&count_private=true" -o assets/stats/github-stats.svg
          sleep 2
          curl -s "https://github-profile-summary-cards.vercel.app/api/cards/repos-per-language?username=nodesagar&theme=nord_dark" -o assets/stats/repos-per-language.svg
          sleep 2
          curl -s "https://github-profile-summary-cards.vercel.app/api/cards/most-commit-language?username=nodesagar&theme=nord_dark" -o assets/stats/most-commit-language.svg
          sleep 2
          curl -s "https://github-profile-summary-cards.vercel.app/api/cards/stats?username=nodesagar&theme=nord_dark" -o assets/stats/stats.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats/
          git diff --cached --quiet || git commit -m "chore: update stats cards"
          git push
